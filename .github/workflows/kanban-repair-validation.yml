name: Hermes Kanban repair validation

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch or commit to validate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install ruamel.yaml
      - run: python -m py_compile agent/conversation_loop.py agent/kanban_stop.py agent/turn_stop_gates.py agent/turn_final_response.py agent/context_compressor.py
      - run: python -m unittest -v tests.agent.test_kanban_handoff_exhausted tests.agent.test_kanban_length_continuation
